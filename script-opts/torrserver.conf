# TorrServer HTTP API endpoint.
torr_server=http://localhost:8090
request_timeout=15

# Path to TorrServer.exe binary. Leave empty to auto-detect from
# <mpv config dir>/bin/TorrServer.exe
# bin_path=C:\path\to\TorrServer.exe

# JacRed torrent aggregator. Comma-separated list tried in order until one
# returns results.
search_server=https://jac.red,https://jacred.stream
# Search API: native or jackett. This only applies on a fresh install (no
# saved state yet). Once you switch it from the "Search API: ... (Click to
# switch)" menu row, your last choice is remembered across restarts in
# cache/torrserver/torrserver-state.json and takes priority over this value.
search_api=native
# Search API key for JacRed. Leave empty to use the default key.
search_api_key=0

# Timeout (seconds) per server request, and how many times to retry the whole
# search (every server each pass). 5s × 2 ≈ 10s total.
search_timeout=5
search_retries=2
search_retry_delay=1

# How many previously added torrents to keep in the root menu.
history_limit=20

# After adding a torrent, how many times to check for its file list
# (metadata can take a few seconds to arrive) and the delay between checks.
metadata_retries=5
metadata_retry_delay=2

# Browser used to open the TorrServer web UI. Leave empty to use the OS's
# default handler for URLs (Start-Process/open/xdg-open).
browser_path=C:\Program Files\Mozilla Firefox\firefox.exe

# How often (seconds) to refresh size/speed/peers-seeds for torrents shown in the root menu.
stats_interval=2

# Comma-separated file size ranges (GB) shown in the Filters menu.
# Each is "min-max" or "min-" for open-ended (e.g. "50-" = 50 GB and up).
size_filters=0-10,10-20,20-30,30-50,50-100,100-

# Minimum seconds between passive TorrServer update checks (opening/returning
# to the root menu never hits the GitHub release API more often than this;
# result is cached in cache/torrserver/torrserver-update-check.json).
# Clicking "Update TorrServer" always checks live, regardless of this value.
update_check_interval=86400

# Truncate long menu titles (torrent names, search query, filter label) with
# "…". Set to no to show them in full.
elide_titles=yes
title_max_chars=100

# Multi-file torrents (series): clicking a video plays it and appends every
# later video file to the mpv playlist. Single-file torrents are unchanged.
queue_episodes=yes

# Play the next queued file when the current one ends. Set to no to leave the
# rest of the playlist loaded but paused at each boundary.
playlist_autoplay=yes

# Episode counter for multi-file torrents in the root menu.
# count      16 episodes
# position   3/16 while playing (episode number / total; a custom playlist
#            uses that playlist's length instead)
# remaining  14/16 while playing (left, including the current one / total)
# Idle torrents always show the episode count.
episode_progress=position

# Extensions treated as episodes. Anything else (subs, nfo, samples) opens
# as a single file and is not queued. Comma-separated, without dots.
video_extensions=mkv,mp4,m4v,mov,avi,wmv,asf,webm,flv,f4v,mpg,mpeg,mpe,m2v,ts,m2ts,mts,m2t,vob,ogv,ogm,divx,3gp,3g2,rm,rmvb,qt,mk3d
